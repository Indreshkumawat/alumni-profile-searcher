spring.application.name=ProfileSearch
# Server Port
# Server Port
server.port=${PORT:8080}

# PostgreSQL Database Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/alumni_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# PhantomBuster Configuration
phantombuster.api.key=${PHANTOMBUSTER_API_KEY:dummy-key}
phantombuster.agent.id=${PHANTOMBUSTER_AGENT_ID:dummy-agent}
phantombuster.api.base-url=https://api.phantombuster.com/api/v2
phantombuster.mock-enabled=${PHANTOMBUSTER_MOCK:true}

